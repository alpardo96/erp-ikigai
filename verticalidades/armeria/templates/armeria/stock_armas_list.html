{% extends 'base.html' %}
{% load static %}

{% block title %}Stock de Armas{% endblock %}

{% block content %}
<div class="h-full flex flex-col pt-3 gap-3 w-full px-3 sm:px-4 lg:px-6">

    <!-- Cabecera Inline Fina -->
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-900">Stock de Armas</h1>
            <p class="mt-2 text-sm text-gray-500">Consulta de armas en depósito y consignación</p>
        </div>
    </div>

    <!-- Pestañas Rápidas por Familia / Estado -->
    <div class="flex items-center gap-1.5 overflow-x-auto pb-1 text-xs font-bold" id="familia-pills">
        <button type="button" onclick="setFamilia('TODOS', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'TODOS' or not selected_familia %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            TODOS
        </button>
        <button type="button" onclick="setFamilia('PISTOLA', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'PISTOLA' %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            PISTOLA
        </button>
        <button type="button" onclick="setFamilia('ESCOPETA', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'ESCOPETA' %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            ESCOPETA
        </button>
        <button type="button" onclick="setFamilia('CARABINA', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'CARABINA' %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            CARABINA
        </button>
        <button type="button" onclick="setFamilia('FUSIL', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'FUSIL' %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            FUSIL
        </button>
        <button type="button" onclick="setFamilia('PISTOLON', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'PISTOLON' %}bg-indigo-600 text-white font-black shadow-indigo-200{% else %}bg-white text-gray-600 hover:bg-gray-100 border border-gray-200{% endif %}">
            PISTOLÓN
        </button>
        <button type="button" onclick="setFamilia('USADAS', this)" 
                class="pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm {% if selected_familia == 'USADAS' %}bg-amber-600 text-white font-black shadow-amber-200{% else %}bg-amber-50 text-amber-800 hover:bg-amber-100 border border-amber-200{% endif %}">
            USADAS
        </button>
    </div>

    <!-- Buscador y Filtros (Fila Única Ultra-Compacta con Flexbox Proporcional) -->
    <form id="form-filtros-stock-armas" 
          hx-get="{% url 'stock_armas_listado' %}" 
          hx-target="#stock-armas-rows" 
          class="bg-white p-2.5 px-3.5 rounded-2xl shadow-sm border border-gray-200 flex flex-wrap lg:flex-nowrap items-end gap-2.5">
        
        <input type="hidden" name="familia" id="familia_input" value="{{ selected_familia|default:'TODOS' }}">

        <!-- Búsqueda Rápida en Vivo (Ampliación Proporcional flex-1) -->
        <div class="relative flex-1 min-w-[200px]">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Búsqueda Rápida (Producto / Marca / Calibre)</label>
            <input type="text" name="producto" id="producto_input" placeholder="Ej: BERSA C.380..." autocomplete="off"
                   hx-get="{% url 'stock_armas_listado' %}" 
                   hx-trigger="keyup changed delay:300ms, search"
                   hx-target="#stock-armas-rows" 
                   hx-include="#form-filtros-stock-armas"
                   class="w-full border-gray-300 rounded-lg px-2.5 py-1 h-8 text-xs focus:ring-indigo-500 focus:border-indigo-500">
        </div>

        <!-- Nro. Serie / Identificador (Ancho Compacto Reducido w-32) -->
        <div class="relative w-32 flex-shrink-0">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Nro. Serie</label>
            <input type="text" name="serie" id="serie_input" placeholder="Serie..." autocomplete="off"
                   hx-get="{% url 'stock_armas_listado' %}"
                   hx-trigger="keyup[this.value.length >= 3 || this.value.length == 0] changed delay:250ms, search"
                   hx-target="#stock-armas-rows"
                   hx-include="#form-filtros-stock-armas"
                   class="w-full border-gray-300 rounded-lg px-2.5 py-1 h-8 text-xs font-mono font-semibold focus:ring-indigo-500 focus:border-indigo-500 uppercase">
        </div>
        
        <!-- CUIM (Ancho Compacto Reducido w-28) -->
        <div class="relative w-28 flex-shrink-0">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">CUIM</label>
            <input type="text" name="cuim" id="cuim_input" placeholder="CUIM..." autocomplete="off"
                   hx-get="{% url 'stock_armas_listado' %}"
                   hx-trigger="keyup[this.value.length >= 3 || this.value.length == 0] changed delay:250ms, search"
                   hx-target="#stock-armas-rows"
                   hx-include="#form-filtros-stock-armas"
                   class="w-full border-gray-300 rounded-lg px-2.5 py-1 h-8 text-xs font-mono focus:ring-indigo-500 focus:border-indigo-500 uppercase">
        </div>

        <!-- Condición (Ancho Compacto Reducido w-36) -->
        <div class="relative w-36 flex-shrink-0">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Condición</label>
            <select name="estado" id="estado_input"
                    hx-get="{% url 'stock_armas_listado' %}" 
                    hx-target="#stock-armas-rows" 
                    hx-include="#form-filtros-stock-armas"
                    class="w-full border-gray-300 rounded-lg px-2 py-1 h-8 text-xs bg-white font-semibold focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Todas</option>
                <option value="NUEVO">Nuevo</option>
                <option value="USADO">Usado</option>
            </select>
        </div>
        
        <!-- Sucursal (Ancho Compacto Reducido w-36) -->
        <div class="relative w-36 flex-shrink-0">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Sucursal</label>
            <select name="sucursal" id="sucursal_input"
                    hx-get="{% url 'stock_armas_listado' %}" 
                    hx-target="#stock-armas-rows" 
                    hx-include="#form-filtros-stock-armas"
                    class="w-full border-gray-300 rounded-lg px-2 py-1 h-8 text-xs bg-white font-semibold focus:ring-indigo-500 focus:border-indigo-500">
                <option value="">Todas</option>
                {% for suc in sucursales %}
                <option value="{{ suc.id }}">{{ suc.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Botón Limpiar (Ancho Mínimo Compacto w-20) -->
        <div class="relative w-20 flex-shrink-0 flex items-end">
            <input type="hidden" name="sort" id="sort_input" value="-fecha">
            <button type="button" 
                    onclick="resetFiltrosStock()" 
                    title="Restablecer Filtros"
                    class="w-full h-8 px-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors border border-gray-300 text-xs flex items-center justify-center">
                <svg class="h-3.5 w-3.5 mr-1 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Limpiar
            </button>
        </div>
    </form>

    <script>
        function setFamilia(familia, btn) {
            document.getElementById('familia_input').value = familia;
            document.querySelectorAll('.pill-familia').forEach(el => {
                el.className = "pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200";
            });
            if (familia === 'USADAS') {
                btn.className = "pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm bg-amber-600 text-white font-black shadow-amber-200";
            } else {
                btn.className = "pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm bg-indigo-600 text-white font-black shadow-indigo-200";
            }
            htmx.trigger('#form-filtros-stock-armas', 'submit');
        }

        function resetFiltrosStock() {
            document.getElementById('form-filtros-stock-armas').reset();
            document.getElementById('familia_input').value = 'TODOS';
            document.querySelectorAll('.pill-familia').forEach((el, idx) => {
                if (idx === 0) {
                    el.className = "pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm bg-indigo-600 text-white font-black shadow-indigo-200";
                } else {
                    el.className = "pill-familia px-3 py-1.5 rounded-xl transition-all shadow-sm bg-white text-gray-600 hover:bg-gray-100 border border-gray-200";
                }
            });
            htmx.trigger('#form-filtros-stock-armas', 'submit');
        }

        function toggleSort(field) {
            const input = document.getElementById('sort_input');
            if (input.value === field) {
                input.value = '-' + field;
            } else {
                input.value = field;
            }
            htmx.trigger('#form-filtros-stock-armas', 'submit');
        }
    </script>

    <!-- Tabla de Trazabilidad (Contenedor de Máxima Altura) -->
    <div class="flex-1 overflow-hidden bg-white shadow-sm border border-gray-200 rounded-2xl mb-4 flex flex-col">
        <div class="overflow-x-auto flex-1">
            <table class="min-w-full divide-y divide-gray-200" id="tabla-trazabilidad">
                <thead class="bg-gray-50 sticky top-0 z-10">
                    <tr>
                        <th onclick="toggleSort('id')" class="cursor-pointer py-2.5 pl-4 pr-2 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por ID">ID</th>
                        <th onclick="toggleSort('producto')" class="cursor-pointer py-2.5 pl-4 pr-2 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Producto">Producto</th>
                        <th onclick="toggleSort('serie')" class="cursor-pointer px-2 py-2.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Serie">Serie</th>
                        <th onclick="toggleSort('cuim')" class="cursor-pointer px-2 py-2.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por CUIM">CUIM</th>
                        <th onclick="toggleSort('marca')" class="cursor-pointer px-2 py-2.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Marca">Marca</th>
                        <th onclick="toggleSort('calibre')" class="cursor-pointer px-2 py-2.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Calibre">Calibre</th>
                        <th onclick="toggleSort('precio')" class="cursor-pointer px-2 py-2.5 text-right text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Precio">Precio ($)</th>
                        <th class="px-2 py-2.5 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Condición</th>
                        <th onclick="toggleSort('sucursal')" class="cursor-pointer px-2 py-2.5 text-left text-xs font-bold text-gray-600 uppercase tracking-wider hover:bg-gray-200 transition-colors" title="Ordenar por Sucursal">Sucursal</th>
                        <th class="px-2 py-2.5 text-center text-xs font-bold text-gray-600 uppercase tracking-wider">Estado Sigimac</th>
                    </tr>
                </thead>
                <tbody id="stock-armas-rows" class="bg-white divide-y divide-gray-100" hx-trigger="load" hx-get="{% url 'stock_armas_listado' %}">
                    <tr><td colspan="10" class="text-center p-6 text-gray-500 text-sm">Cargando subproductos...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
