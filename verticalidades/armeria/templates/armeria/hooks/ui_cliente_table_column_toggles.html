{% if empresa_actual and empresa_actual.tipo_actividad == 'ARMERIA' %}
<div class="border-t border-purple-100 my-2 pt-2">
    <p class="text-[10px] font-bold text-purple-600 uppercase tracking-wider mb-2 px-2">Datos Armería</p>
    <label class="flex items-center p-2 rounded-xl hover:bg-purple-50/50 cursor-pointer transition-colors">
        <input type="checkbox" data-column="col-clu" checked class="rounded text-purple-600 focus:ring-purple-500 mr-3">
        <span class="text-sm text-purple-900 font-medium">N° CLU</span>
    </label>
    <label class="flex items-center p-2 rounded-xl hover:bg-purple-50/50 cursor-pointer transition-colors">
        <input type="checkbox" data-column="col-clu-vto" checked class="rounded text-purple-600 focus:ring-purple-500 mr-3">
        <span class="text-sm text-purple-900 font-medium">Vencimiento CLU</span>
    </label>
    <label class="flex items-center p-2 rounded-xl hover:bg-purple-50/50 cursor-pointer transition-colors">
        <input type="checkbox" data-column="col-policia" checked class="rounded text-purple-600 focus:ring-purple-500 mr-3">
        <span class="text-sm text-purple-900 font-medium">Es Policía</span>
    </label>
</div>
{% endif %}
