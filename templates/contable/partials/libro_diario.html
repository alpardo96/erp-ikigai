<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 shadow-sm">
    <form id="filtros-diario-form" hx-get="{% url 'libro_diario_rows' %}" hx-target="#diario-rows" hx-swap="outerHTML" novalidate class="flex flex-col gap-4">
        <input type="hidden" name="filtering" value="1">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
            <!-- Fecha Desde (Predeterminado inicio del ejercicio) -->
            <div class="md:col-span-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Fecha Desde</label>
                <input type="date" name="fecha_desde" value="{{ fecha_inicio }}"
                       style="font-size: 18px !important;"
                       class="w-full h-10 px-2 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-indigo-500"
                       title="Fecha Desde">
            </div>
            <!-- Fecha Hasta (El menor entre date() y cierre_ejercicio) -->
            <div class="md:col-span-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Fecha Hasta</label>
                <input type="date" name="fecha_hasta" value="{{ fecha_cierre }}" style="font-size: 18px !important;"
                       class="w-full h-10 px-2 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-indigo-500"
                       title="Fecha Hasta">
            </div>

            <!-- ID Asiento Desde (cble_asiento_enc.asiento_id) -->
            <div class="md:col-span-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Asiento ID Desde</label>
                <input type="number" name="asiento_desde" placeholder="Ej. 1001"
                       class="w-full h-10 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-indigo-500">
            </div>
            <!-- ID Asiento Hasta -->
            <div class="md:col-span-2">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Asiento ID Hasta</label>
                <input type="number" name="asiento_hasta" placeholder="Ej. 1050"
                       class="w-full h-10 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-indigo-500">
            </div>

            <!-- Estado Asiento (Activos, Anulados, Todos) -->
            <div class="md:col-span-4">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Estado Asiento</label>
                <select name="estado" class="w-full h-10 px-3 py-2 bg-white border border-slate-200 rounded-lg text-sm font-bold text-slate-800 outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="1" selected>Sólo Activos</option>
                    <option value="2">Sólo Anulados</option>
                    <option value="0">Todos (Activos y Anulados)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end pt-2 border-t border-slate-200/60">
            <!-- Condición -->
            <div class="md:col-span-6">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Condición</label>
                <div class="flex flex-wrap items-center gap-1.5">
                    {% for c in condic_opciones %}
                    <label class="flex items-center gap-1.5 px-2.5 py-2 rounded-lg cursor-pointer hover:border-indigo-400 transition bg-white border border-slate-200">
                        <input type="checkbox" name="condic" value="{{ c.valor }}" checked
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-xs font-bold text-slate-700">{{ c.valor }} - {{ c.nombre }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="md:col-span-6 flex items-center justify-end gap-2">
                <button type="submit"
                    class="h-10 px-5 bg-slate-900 hover:bg-slate-800 text-white font-black rounded-lg text-[11px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span>Filtrar</span>
                </button>
                <button type="button" onclick="exportarPdfDiario()"
                    class="h-10 px-3.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span>PDF</span>
                </button>
                <button type="button" onclick="exportarExcelDiario()"
                    class="h-10 px-3.5 bg-green-600 hover:bg-green-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Excel</span>
                </button>
                <button type="button" hx-get="{% url 'asiento_add' %}" hx-target="#modal-container"
                    class="h-10 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>Nuevo Asiento</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script>
function getFiltrosURL() {
    let form = document.getElementById('filtros-diario-form');
    if (!form) return '';
    let formData = new FormData(form);
    return new URLSearchParams(formData).toString();
}
function exportarExcelDiario() {
    window.location.href = "{% url 'exportar_diario_excel' %}?" + getFiltrosURL();
}
function exportarPdfDiario() {
    window.location.href = "{% url 'exportar_diario_pdf' %}?" + getFiltrosURL();
}
</script>

<div class="bg-white border border-gray-200 rounded-2xl overflow-x-auto shadow-sm">
    <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
            <tr>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-10"></th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID Asiento</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Fecha</th>
                <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Concepto</th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Monto Total</th>
                <th class="px-6 py-3 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Estado</th>
                <th class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200" id="diario-rows"
            hx-trigger="reloadDiario from:body">
            <tr>
                <td colspan="7" class="px-6 py-12 text-center text-gray-500">
                    <svg class="mx-auto h-12 w-12 text-indigo-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
                    </svg>
                    <p class="font-medium text-base text-gray-900">Seleccione los parámetros de consulta y presione "Filtrar"</p>
                    <p class="text-xs text-gray-400 mt-1">Defina el rango de fechas, ID de asiento o condición para generar el Libro Diario.</p>
                </td>
            </tr>
        </tbody>
    </table>
</div>
