<div class="bg-slate-50 border border-slate-200 rounded-xl p-4 mb-6 shadow-sm">
    <form id="filtros-diario-form" hx-get="{% url 'libro_diario_rows' %}" hx-target="#diario-table-container" hx-swap="innerHTML" novalidate class="flex flex-col gap-4">
        <input type="hidden" name="filtering" value="1">
        
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end">
            <!-- Fecha Desde (Predeterminado inicio del ejercicio) -->
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Desde</label>
                <input type="date" name="fecha_desde" value="{{ fecha_inicio }}"
                       class="w-full h-8 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-indigo-500"
                       title="Fecha Desde">
            </div>
            <!-- Fecha Hasta (El menor entre date() y cierre_ejercicio) -->
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha Hasta</label>
                <input type="date" name="fecha_hasta" value="{{ fecha_cierre }}"
                       class="w-full h-8 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-indigo-500"
                       title="Fecha Hasta">
            </div>

            <!-- ID Asiento Desde (cble_asiento_enc.asiento_id) -->
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Asiento ID Desde</label>
                <input type="number" name="asiento_desde" placeholder="Ej. 1001"
                       class="w-full h-8 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-indigo-500">
            </div>
            <!-- ID Asiento Hasta -->
            <div class="md:col-span-2">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Asiento ID Hasta</label>
                <input type="number" name="asiento_hasta" placeholder="Ej. 1050"
                       class="w-full h-8 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-indigo-500">
            </div>

            <!-- Estado Asiento (Activos, Anulados, Todos) -->
            <div class="md:col-span-4">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Estado Asiento</label>
                <select name="estado" class="w-full h-8 px-2 py-1 bg-white border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-indigo-500 cursor-pointer">
                    <option value="1" selected>Sólo Activos</option>
                    <option value="2">Sólo Anulados</option>
                    <option value="0">Todos (Activos y Anulados)</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-end pt-2 border-t border-slate-200/60">
            <!-- Condición -->
            <div class="md:col-span-6">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Condición</label>
                <div class="flex flex-wrap items-center gap-1.5">
                    {% for c in condic_opciones %}
                    <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-lg cursor-pointer hover:border-indigo-400 transition bg-white border border-slate-200">
                        <input type="checkbox" name="condic" value="{{ c.valor }}" checked
                        class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="text-xs font-bold text-slate-700">{{ c.valor }} - {{ c.nombre }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <!-- Botones de Acción -->
            <div class="md:col-span-6 flex items-center justify-end gap-2">
                <button type="submit"
                    class="h-8 px-4 bg-slate-900 hover:bg-slate-800 text-white font-black rounded-lg text-[11px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <span>Filtrar</span>
                </button>
                <button type="button" onclick="exportarPdfDiario()"
                    class="h-8 px-2.5 bg-red-600 hover:bg-red-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                    <span>PDF</span>
                </button>
                <button type="button" onclick="exportarExcelDiario()"
                    class="h-8 px-2.5 bg-green-600 hover:bg-green-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Excel</span>
                </button>
                <button type="button" hx-get="{% url 'asiento_add' %}" hx-target="#modal-container"
                    class="h-8 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black rounded-lg text-[10px] uppercase tracking-widest shadow transition-all flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    <span>Nuevo Asiento</span>
                </button>
            </div>
        </div>
    </form>
</div>

<script>
function getFiltrosURL() {
    let form = document.getElementById('filtros-diario-form');
    if (!form) return '';
    let formData = new FormData(form);
    return new URLSearchParams(formData).toString();
}
function exportarExcelDiario() {
    window.location.href = "{% url 'exportar_diario_excel' %}?" + getFiltrosURL();
}
function exportarPdfDiario() {
    window.location.href = "{% url 'exportar_diario_pdf' %}?" + getFiltrosURL();
}
</script>

<div class="bg-white border border-gray-200 rounded-2xl overflow-x-auto shadow-sm" id="diario-table-container">
    {% include 'contable/partials/libro_diario_rows.html' %}
</div>
