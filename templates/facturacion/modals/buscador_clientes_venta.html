<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
    <div class="bg-white w-full max-w-2xl mx-4 rounded-xl shadow-2xl flex flex-col max-h-[85vh] border border-slate-200"
         @click.stop>
        
        <!-- HEADER -->
        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 p-1.5 rounded-lg">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                </div>
                <div>
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-tight">Buscar Cliente</h2>
                    <p class="text-[10px] font-bold text-slate-500">Seleccione un cliente para la venta</p>
                </div>
            </div>
            <button type="button" 
                    onclick="document.body.dispatchEvent(new Event('cerrarModal'))"
                    class="text-slate-400 hover:text-red-500 transition-colors p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- SEARCH BAR -->
        <div class="p-3 border-b border-slate-100 bg-white">
            <div class="relative flex items-center">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input type="text" 
                       name="q" 
                       autofocus
                       placeholder="Buscar por Razón Social o CUIT..."
                       class="w-full h-10 pl-11 pr-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-800 outline-none focus:border-blue-500 focus:bg-white transition-all shadow-inner"
                       hx-get="{% url 'ventas_cliente_buscar_lista' %}"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target="#clientes-results-body"
                       hx-indicator="#loading-clientes">
                <div id="loading-clientes" class="absolute right-3 htmx-indicator">
                    <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- RESULTS GRID -->
        <div class="flex-1 overflow-auto bg-slate-50/50 p-2">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-slate-100 z-10 shadow-sm rounded-t-lg">
                    <tr class="text-[9px] font-black text-slate-500 uppercase tracking-widest">
                        <th class="px-3 py-2 border-b border-slate-200 rounded-tl-lg">ID</th>
                        <th class="px-3 py-2 border-b border-slate-200">Razón Social</th>
                        <th class="px-3 py-2 border-b border-slate-200">CUIT</th>
                        <th class="px-3 py-2 border-b border-slate-200 text-right">Saldo</th>
                        <th class="px-3 py-2 border-b border-slate-200 text-right rounded-tr-lg">Acción</th>
                    </tr>
                </thead>
                <tbody id="clientes-results-body" 
                       class="divide-y divide-slate-100"
                       hx-get="{% url 'ventas_cliente_buscar_lista' %}"
                       hx-trigger="load">
                    <!-- HTMX INJECTS HERE -->
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-400">
                            <svg class="animate-spin h-6 w-6 text-slate-300 mx-auto mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span class="text-[10px] font-bold uppercase tracking-widest">Buscando Clientes...</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>
</div>
