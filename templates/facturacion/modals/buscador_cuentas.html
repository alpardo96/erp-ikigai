<!-- MODAL BUSCADOR DE CUENTAS (FACTURACIÓN) -->
<div class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity px-4 py-6"
    id="buscador-cuentas-backdrop">
    
    <div class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl transition-all w-full max-w-3xl flex flex-col max-h-[85vh]">
        <!-- Cabecera -->
        <div class="bg-gradient-to-r from-gray-50 to-white px-8 py-5 border-b border-gray-100 flex items-center justify-between shrink-0">
            <div class="flex items-center">
                <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-600 mr-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Buscar Cuenta Contable</h3>
                    <p class="text-xs text-gray-400">Escriba el nombre o jerarquía para filtrar</p>
                </div>
            </div>
            <button type="button" class="text-gray-400 hover:text-red-500 transition-colors p-2 hover:bg-red-50 rounded-full"
                onclick="document.getElementById('modal-buscador-cuentas').innerHTML = ''">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Buscador -->
        <div class="p-6 border-b border-gray-100 bg-white shrink-0">
            <div class="relative">
                <input type="text" 
                    name="q"
                    class="w-full pl-11 pr-4 py-3 rounded-2xl border-gray-200 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm"
                    placeholder="Buscar cuenta..."
                    autofocus
                    hx-get="{% url 'buscar_cuentas_facturacion' %}"
                    hx-target="#cuentas-search-results"
                    hx-trigger="keyup changed delay:300ms, search">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Tabla de Resultados -->
        <div class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50 p-6">
            <table class="min-w-full divide-y divide-gray-200 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Jerarquía</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Nombre</th>
                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Tipo</th>
                        <th class="px-6 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">Acción</th>
                    </tr>
                </thead>
                <tbody id="cuentas-search-results" class="divide-y divide-gray-100 bg-white"
                    hx-get="{% url 'buscar_cuentas_facturacion' %}" 
                    hx-trigger="load">
                    <!-- Se llena vía HTMX -->
                    <tr><td colspan="4" class="p-8 text-center text-gray-400"><svg class="animate-spin h-5 w-5 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
