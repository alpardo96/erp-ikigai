<div id="modal-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-[110] backdrop-blur-sm"></div>
<div class="fixed inset-0 flex items-center justify-center z-[120] p-4">
    <div class="bg-white rounded shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden italic">
        <!-- Header -->
        <div class="bg-slate-900 text-white px-4 py-2 flex justify-between items-center">
            <h3 class="text-sm font-bold flex items-center uppercase tracking-tighter">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                Buscador de Comprobantes
            </h3>
            <div class="flex items-center gap-2">
                <button type="button"
                        hx-get="{% url 'tipo_comprobante_add' %}"
                        hx-vals='js:{codigo: document.querySelector("[name=f_cod]") ? document.querySelector("[name=f_cod]").value : ""}'
                        hx-target="#modal-container" hx-swap="innerHTML"
                        class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1 rounded text-[10px] font-black uppercase tracking-widest transition-all">
                    + Nuevo
                </button>
                <button onclick="document.getElementById('modal-container').innerHTML = ''" class="text-slate-400 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
        </div>

        <!-- Filters & Table -->
        <div class="flex-1 overflow-auto p-0">
            <table class="w-full text-left border-collapse">
                <thead class="sticky top-0 bg-white border-b border-slate-200 shadow-sm z-20">
                    <tr class="text-[9px] uppercase text-slate-400 bg-slate-50 font-black tracking-widest">
                        <th class="px-2 py-2">Código</th>
                        <th class="px-2 py-2 w-1/2">Descripción</th>
                        <th class="px-2 py-2 text-center">Estado (Ventas)</th>
                        <th class="px-2 py-2 text-right"></th>
                    </tr>
                    <tr class="bg-white border-b border-slate-100">
                        <th class="px-1 py-1">
                            <input type="text" name="f_cod" value="{{ q_initial }}" autofocus
                                   hx-get="{% url 'compras_comprobante_buscar_lista' %}" hx-trigger="keyup changed delay:300ms, load" 
                                   hx-target="#comprobantes-search-results" hx-include="closest thead"
                                   class="w-full h-8 px-2 text-[11px] border border-slate-200 rounded outline-none focus:border-blue-500 font-bold uppercase shadow-inner">
                        </th>
                        <th class="px-1 py-1">
                            <input type="text" name="f_det" 
                                   hx-get="{% url 'compras_comprobante_buscar_lista' %}" hx-trigger="keyup changed delay:300ms" 
                                   hx-target="#comprobantes-search-results" hx-include="closest thead"
                                   class="w-full h-8 px-2 text-[11px] border border-slate-200 rounded outline-none focus:border-blue-500 font-bold uppercase shadow-inner">
                        </th>
                        <th class="px-1 py-1"></th>
                        <th class="px-1 py-1"></th>
                    </tr>
                </thead>
                <tbody id="comprobantes-search-results" class="text-[11px]">
                    <tr><td colspan="4" class="p-8 text-center text-slate-400 font-medium">Buscando comprobantes...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
