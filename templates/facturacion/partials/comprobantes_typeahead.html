<div class="divide-y divide-slate-100 bg-white">
    {% for c in comprobantes %}
    <button type="button"
            class="flex w-full items-center justify-between gap-3 px-3 py-2 text-left hover:bg-slate-100 transition-colors"
            onclick="document.body.dispatchEvent(new CustomEvent('comprobanteSeleccionado', { detail: { id: '{{ c.id }}', codigo: '{{ c.codigo|escapejs }}', detalle: '{{ c.detalle|escapejs }}' } }))">
        <span class="min-w-0">
            <span class="block truncate text-xs font-bold uppercase text-slate-800">{{ c.detalle }}</span>
        </span>
        <span class="shrink-0 text-right">
            <span class="block text-[10px] font-black text-slate-500">{{ c.codigo }}</span>
        </span>
    </button>
    {% empty %}
    <div class="px-6 py-8 text-center bg-white">
        <svg class="w-9 h-9 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <p class="text-xs font-black text-slate-500 uppercase tracking-widest">No encontrado.</p>
        <p class="text-[10px] text-slate-400 mt-1">Revise el código o descripción.</p>
    </div>
    {% endfor %}
</div>
