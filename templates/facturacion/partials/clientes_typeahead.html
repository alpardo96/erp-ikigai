<div class="divide-y divide-slate-100 bg-white">
    {% for c in clientes %}
    <button type="button"
            class="flex w-full items-center justify-between gap-3 px-3 py-2 text-left hover:bg-indigo-50 transition-colors"
            onmousedown="event.preventDefault(); document.body.dispatchEvent(new CustomEvent('clienteVentaSeleccionado', { detail: { id: '{{ c.pk }}', razon_social: '{{ c.razon_social|escapejs }}', tipo_documento: '{{ c.tipo_documento }}', cuit: '{{ c.cuit|default:""|escapejs }}', cta_res: '{{ c.cta_res|default:0 }}', condicion_iva: '{{ c.condicion_iva|escapejs }}', usa_orden_compra: '{% if c.usa_orden_compra %}true{% else %}false{% endif %}', clasificacion: '{{ c.clasificacion|escapejs }}' }, bubbles: true }))"
            onclick="document.body.dispatchEvent(new CustomEvent('clienteVentaSeleccionado', { detail: { id: '{{ c.pk }}', razon_social: '{{ c.razon_social|escapejs }}', tipo_documento: '{{ c.tipo_documento }}', cuit: '{{ c.cuit|default:""|escapejs }}', cta_res: '{{ c.cta_res|default:0 }}', condicion_iva: '{{ c.condicion_iva|escapejs }}', usa_orden_compra: '{% if c.usa_orden_compra %}true{% else %}false{% endif %}', clasificacion: '{{ c.clasificacion|escapejs }}' }, bubbles: true }))">
        <span class="min-w-0">
            <span class="block truncate text-xs font-bold uppercase text-slate-800">{{ c.razon_social }}</span>
            <span class="block text-[10px] font-semibold text-slate-500">CUIT: {{ c.cuit|default:"-" }}</span>
        </span>
        <span class="shrink-0 text-right">
            <span class="block text-[10px] font-black text-slate-400">#{{ c.pk }}</span>
            <span class="block text-[10px] font-bold text-indigo-600">$ {{ c.saldo_pendiente|default:c.saldo|floatformat:2 }}</span>
        </span>
    </button>
    {% empty %}
    <div class="px-6 py-8 text-center bg-white">
        <svg class="w-9 h-9 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <p class="text-xs font-black text-slate-500 uppercase tracking-widest">No se encontraron entidades.</p>
        <p class="text-[10px] text-slate-400 mt-1">Intente con otra razon social o CUIT.</p>
    </div>
    {% endfor %}
</div>
