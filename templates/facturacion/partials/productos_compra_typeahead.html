<div class="divide-y divide-slate-100 bg-white">
    {% for p in productos %}
    <button type="button"
            class="flex w-full items-center justify-between gap-3 px-3 py-2 text-left hover:bg-blue-50 transition-colors"
            onclick="document.body.dispatchEvent(new CustomEvent('productoEncontrado', { detail: { id: '{{ p.id }}', detalle: '{{ p.detalle|escapejs }}', precio_sugerido: '{{ p.cto_rep|floatformat:2|default:0 }}', cod_prov: '{{ p.cod_prov|default:''|escapejs }}', proveedor_id: '{{ p.proveedor_id|default:0 }}' } }))">
        <span class="min-w-0">
            <span class="block truncate text-xs font-bold uppercase text-slate-800">{{ p.detalle }}</span>
            <span class="block text-[10px] font-semibold text-slate-500">{% if p.cod_prov %}CÓD. PROV: {{ p.cod_prov }}{% else %}SIN CÓD. PROV{% endif %}{% if p.cod_fab %} | FAB: {{ p.cod_fab }}{% endif %}</span>
        </span>
        <span class="shrink-0 text-right">
            <span class="block text-[10px] font-black text-slate-400">ID: #{{ p.id }}</span>
            <span class="block text-[10px] font-bold text-blue-600">CTO: $ {{ p.cto_rep|floatformat:2|default:0 }}</span>
        </span>
    </button>
    {% empty %}
    <div class="px-6 py-8 text-center bg-white">
        <svg class="w-9 h-9 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
        </svg>
        <p class="text-xs font-black text-slate-500 uppercase tracking-widest">No se encontraron productos.</p>
        <p class="text-[10px] text-slate-400 mt-1">Intente con otro código o descripción.</p>
    </div>
    {% endfor %}
</div>
