{% for comp in comprobantes %}
<tr class="hover:bg-blue-50 border-b border-slate-100 transition-colors cursor-pointer group"
    onclick="seleccionarComprobante('{{ comp.codigo }}', '{{ comp.detalle|escapejs }}')">
    <td class="px-2 py-1.5 font-black text-blue-600">{{ comp.codigo }}</td>
    <td class="px-2 py-1.5 font-bold text-slate-700 uppercase italic">{{ comp.detalle }}</td>
    <td class="px-2 py-1.5 text-center">
        {% if comp.estado %}
        <span class="px-1.5 py-0.5 rounded font-black bg-green-100 text-green-700 text-[9px]">ACTIVO</span>
        {% else %}
        <span class="px-1.5 py-0.5 rounded font-black bg-slate-100 text-slate-400 text-[9px]">INACTIVO</span>
        {% endif %}
    </td>
    <td class="px-2 py-1.5 text-right">
        <button type="button" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded font-black text-[9px] uppercase shadow-sm transition-all opacity-0 group-hover:opacity-100">
            SEL
        </button>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="p-8 text-center text-slate-400 italic">No se encontraron comprobantes con esos filtros.</td>
</tr>
{% endfor %}

<script>
    function seleccionarComprobante(codigo, detalle) {
        // Mismo evento que el typeahead inline: setea el tipo (id_tipo) y el display.
        document.body.dispatchEvent(new CustomEvent('comprobanteSeleccionado', { detail: { codigo: codigo, detalle: detalle } }));
        document.getElementById('modal-container').innerHTML = '';
    }
</script>
