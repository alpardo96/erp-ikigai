{% for cuenta in cuentas %}
<tr class="hover:bg-indigo-50/50 transition-colors cursor-pointer group"
    @click="$dispatch('cuenta-seleccionada', { 
        id: '{{ cuenta.id }}', 
        nombre: '{{ cuenta.jerarquia }} - {{ cuenta.cuenta|escapejs }}' 
    }); document.getElementById('modal-buscador-cuentas').innerHTML = ''">
    
    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500 font-mono">{{ cuenta.jerarquia }}</td>
    <td class="px-6 py-3 whitespace-nowrap text-sm font-semibold text-gray-900 group-hover:text-indigo-600 transition-colors">{{ cuenta.cuenta }}</td>
    <td class="px-6 py-3 whitespace-nowrap text-sm text-gray-500">{{ cuenta.get_tipo_display }}</td>
    <td class="px-6 py-3 whitespace-nowrap text-center text-sm font-medium">
        <button type="button" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 px-3 py-1 rounded-lg transition-colors font-semibold">
            Seleccionar
        </button>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="px-6 py-12 text-center text-gray-500">
        <div class="flex flex-col items-center">
            <svg class="w-12 h-12 text-gray-300 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <p class="text-sm font-medium">No se encontraron cuentas contables imputables.</p>
        </div>
    </td>
</tr>
{% endfor %}
