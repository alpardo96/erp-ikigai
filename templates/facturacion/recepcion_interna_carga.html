{% extends 'base.html' %}
{% load l10n %}
{% block title %}Recepción Interna{% endblock %}
{% block content %}
<div class="max-w-full mx-auto w-full px-4 py-2 space-y-4">
    <div class="flex justify-between items-center border-b border-gray-200 pb-2">
        <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase italic">Recepción Interna (entre sucursales)</h1>
        <div class="flex items-center gap-3">
            <span class="text-[11px] font-black text-slate-400 uppercase italic">Número asignado al confirmar</span>
            <a href="{% url 'recepcion_interna_listado' %}" class="text-slate-400 hover:text-red-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>
    </div>

    <form method="post" action="{% url 'recepcion_interna_carga' %}" id="reci-form" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
        {% csrf_token %}
        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-4 mb-4 italic">
            <div class="grid grid-cols-12 gap-4 items-end">
                <div class="col-span-2">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Fecha</label>
                    <input type="date" name="fecha" value="{{ fecha_hoy|date:'Y-m-d' }}" required
                           class="w-full h-10 px-3 bg-slate-50 border border-slate-200 rounded-lg text-[13px] font-bold text-slate-800 outline-none focus:bg-white shadow-inner">
                </div>
                <div class="col-span-4">
                    <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Sucursal Receptor (Destino - Sucursal Activa)</label>
                    <input type="hidden" name="sucursal" id="id_sucursal_destino" value="{{ sucursal_activa.pk }}">
                    <div class="h-10 px-3 bg-slate-100 border border-slate-200 rounded-lg flex items-center text-[12px] font-black text-slate-800 uppercase shadow-inner">
                        <svg class="w-4 h-4 text-emerald-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        {{ sucursal_activa.nombre }} (Pto {{ sucursal_activa.punto|stringformat:"04d" }})
                    </div>
                </div>
                <div class="col-span-6 flex items-end">
                    <button type="button" onclick="reciVincular()"
                            class="h-10 px-5 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-lg text-[11px] uppercase tracking-widest shadow-lg transition-all">
                        Vincular Remito Interno
                    </button>
                </div>
            </div>
        </div>

        <div id="reci-items-container" class="mb-4" hx-get="{% url 'recepcion_interna_vincular' %}" hx-trigger="load"></div>

        <div class="bg-white rounded-xl shadow-md border border-slate-200 p-4 flex items-start justify-between gap-4 italic">
            <div class="flex-1">
                <label class="block text-[10px] font-black text-slate-400 uppercase mb-1">Observaciones</label>
                <textarea name="observaciones" rows="2" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-[12px] font-bold text-slate-800 outline-none focus:bg-white shadow-inner"></textarea>
            </div>
            <div class="w-48 flex items-end">
                <button type="submit" class="w-full h-12 bg-emerald-600 hover:bg-emerald-700 text-white font-black rounded-lg text-[11px] uppercase tracking-widest shadow-lg active:scale-95">Confirmar Recepción</button>
            </div>
        </div>
    </form>
</div>

<script>
    const URL_RECI_VINCULAR_MODAL = "{% url 'recepcion_interna_vincular_modal' %}";
    function reciVincular() {
        const destino = document.getElementById('id_sucursal_destino').value;
        htmx.ajax('GET', URL_RECI_VINCULAR_MODAL + '?destino=' + encodeURIComponent(destino), { target: '#modal-container', swap: 'innerHTML' });
    }
    document.body.addEventListener('htmx:configRequest', (event) => {
        ['cantidad_recibida'].forEach(f => { if (event.detail.parameters[f]) event.detail.parameters[f] = event.detail.parameters[f].toString().replace(/\./g, '').replace(',', '.'); });
    });
</script>
{% endblock %}
