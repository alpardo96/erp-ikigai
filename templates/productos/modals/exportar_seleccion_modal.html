<div class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Fondo oscuro translúcido -->
        <div class="fixed inset-0 bg-gray-900 bg-opacity-60 backdrop-blur-sm transition-opacity" onclick="cerrarModalExportar()"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-xl sm:w-full border border-gray-100">
            <form action="{% url 'producto_exportar_seleccion' %}" method="POST" target="_blank" onsubmit="cerrarModalExportar()">
                {% csrf_token %}
                <input type="hidden" name="q" value="{{ q }}">

                <!-- Encabezado del Modal -->
                <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 px-6 py-5 flex items-center justify-between text-white">
                    <div class="flex items-center gap-3">
                        <div class="p-2.5 bg-indigo-500/20 rounded-2xl border border-indigo-400/30">
                            <svg class="w-6 h-6 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-white">Exportar Listado Personalizado</h3>
                            <p class="text-xs text-indigo-200">Seleccione los campos de productos que desea incluir en el archivo Excel</p>
                        </div>
                    </div>
                    <button type="button" onclick="cerrarModalExportar()" class="text-gray-400 hover:text-white transition-colors p-1 rounded-xl hover:bg-white/10">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Botones de Selección Rápida -->
                <div class="px-6 pt-4 pb-2 bg-gray-50/80 border-b border-gray-100 flex items-center justify-between">
                    <span class="text-xs font-bold text-gray-500 uppercase tracking-wider">Campos de la Tabla</span>
                    <div class="flex gap-2 text-xs">
                        <button type="button" onclick="marcarTodosCampos(true)" class="text-indigo-600 hover:text-indigo-800 font-semibold hover:underline">Marcar Todos</button>
                        <span class="text-gray-300">|</span>
                        <button type="button" onclick="marcarTodosCampos(false)" class="text-gray-500 hover:text-gray-700 font-semibold hover:underline">Desmarcar Todos</button>
                    </div>
                </div>

                <!-- Grilla de Checkboxes (Todos los campos del Modelo) -->
                <div class="p-6 max-h-[60vh] overflow-y-auto">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="contenedor-checkboxes-export">
                        {% for key, label in columnas_map.items %}
                        <label class="flex items-center p-3 rounded-2xl bg-gray-50 hover:bg-indigo-50/60 border border-gray-100 hover:border-indigo-200 cursor-pointer transition-all">
                            <input type="checkbox" name="columnas" value="{{ key }}" checked class="chk-export-col rounded-md text-indigo-600 focus:ring-indigo-500 w-4 h-4 border-gray-300 mr-3">
                            <span class="text-sm font-medium text-gray-800">{{ label }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>

                <!-- Pie del Modal -->
                <div class="bg-gray-50 px-6 py-4 border-t border-gray-100 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="text-xs text-gray-500 flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>Formato `.xlsx` compatible con Excel y Hojas de Cálculo</span>
                    </div>
                    <div class="flex gap-3 w-full sm:w-auto">
                        <button type="button" onclick="cerrarModalExportar()" class="flex-1 sm:flex-none px-4 py-2.5 bg-white border border-gray-300 text-gray-700 rounded-xl hover:bg-gray-100 transition-all font-medium text-sm">
                            Cancelar
                        </button>
                        <button type="submit" class="flex-1 sm:flex-none inline-flex items-center justify-center px-5 py-2.5 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all font-medium text-sm shadow-md shadow-indigo-200">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            Generar Excel
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function cerrarModalExportar() {
        const container = document.getElementById('modal-container');
        if (container) container.innerHTML = '';
    }

    function marcarTodosCampos(estado) {
        const checkboxes = document.querySelectorAll('.chk-export-col');
        checkboxes.forEach(cb => cb.checked = estado);
    }
</script>
