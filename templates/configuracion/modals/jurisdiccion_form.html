<!-- 
    MODAL DE JURISDICCIÓN (AFIP)
    Gestiona las provincias y sus códigos oficiales para facturación electrónica.
    Posicionamiento: ABSOLUTO (dentro del dashboard).
-->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity px-4 py-10 overflow-y-auto" id="modal-backdrop">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg transform transition-all overflow-hidden border border-gray-100 my-auto" id="modal-content">
        
        <!-- Cabecera del Modal -->
        <div class="px-8 py-6 border-b border-gray-100 flex items-center justify-between bg-gradient-to-r from-gray-50 to-white">
            <h3 class="text-xl font-bold text-gray-900">
                {% if jurisdiccion %}Editar Jurisdicción{% else %}Nueva Jurisdicción{% endif %}
            </h3>
            <button type="button" 
                    class="text-gray-400 hover:text-red-500 transition-colors p-2 hover:bg-red-50 rounded-full"
                    onclick="document.getElementById('modal-container').innerHTML = ''">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Formulario HTMX: Al guardar con éxito, dispara 'reloadJurisdicciones' -->
        <form hx-post="{% if jurisdiccion %}{% url 'config_jurisdiccion_edit' jurisdiccion.id %}{% else %}{% url 'config_jurisdiccion_add' %}{% endif %}" 
              hx-target="#modal-container" hx-swap="innerHTML"
              class="px-8 py-6 space-y-6">
            <div class="px-8 py-8 space-y-6">
                <div class="flex items-start">
                    <div class="flex-shrink-0 bg-emerald-50 p-3 rounded-2xl">
                        <svg class="h-6 w-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div class="ml-4 flex-1 space-y-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Código AFIP (Numérico)</label>
                            {{ form.codigo }}
                            {% if form.codigo.errors %}<p class="text-red-500 text-[10px] mt-1 italic">{{ form.codigo.errors.0 }}</p>{% endif %}
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre de la Provincia</label>
                            {{ form.nombre }}
                            {% if form.nombre.errors %}<p class="text-red-500 text-[10px] mt-1 italic">{{ form.nombre.errors.0 }}</p>{% endif %}
                        </div>
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="bg-gray-50 px-8 py-5 flex justify-end space-x-3">
                <button type="button" 
                        class="px-6 py-2 text-sm font-medium text-gray-500 hover:text-gray-700"
                        onclick="document.getElementById('modal-container').innerHTML = ''">
                    Cancelar
                </button>
                <button type="submit" 
                        class="px-8 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-lg transition-transform active:scale-95">
                    Guardar Jurisdicción
                </button>
            </div>
        </form>
    </div>
</div>
