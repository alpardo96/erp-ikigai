<div class="fixed inset-0 bg-gray-900 bg-opacity-50 backdrop-blur-sm flex items-center justify-center z-50 p-4 animate-fade-in" id="modal-backdrop"
    onclick="if(event.target === this) document.getElementById('modal-container').innerHTML = ''">
    
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all animate-slide-up relative">
        <!-- Close button -->
        <button onclick="document.getElementById('modal-container').innerHTML = ''" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors z-10">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <!-- Header -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-5">
            <div class="flex items-center space-x-3 text-white">
                <div class="bg-white/20 p-2 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-xl font-bold">Cotizaciones de Moneda</h3>
                    <p class="text-emerald-100 text-sm mt-1">Configura el tipo de cambio oficial para el sistema</p>
                </div>
            </div>
        </div>

        <form hx-post="{% url 'config_cotizaciones' %}"
              hx-target="#modal-container"
              class="p-6">
            {% csrf_token %}
            
            <div class="space-y-5">
                <!-- Venta -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Dólar Venta</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-bold">$</span>
                        </div>
                        {{ form.dolar_venta }}
                    </div>
                    <p class="mt-1 text-xs text-gray-500">Se usará para pesificar facturas de venta.</p>
                </div>

                <!-- Cobranza -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Dólar Cobranza</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-bold">$</span>
                        </div>
                        {{ form.dolar_cobranza }}
                    </div>
                    <p class="mt-1 text-xs text-gray-500">Se usará en la recepción de pagos en tesorería.</p>
                </div>
            </div>

            <!-- Acciones -->
            <div class="mt-8 flex justify-end space-x-3 pt-4 border-t border-gray-100">
                <button type="button" 
                        onclick="document.getElementById('modal-container').innerHTML = ''"
                        class="px-5 py-2.5 bg-white border border-gray-300 text-gray-700 font-semibold rounded-xl shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all">
                    Cancelar
                </button>
                <button type="submit" style="background-color: #059669; color: white;"
                        class="px-5 py-2.5 font-semibold rounded-xl shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform active:scale-95 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-white">Guardar Cotizaciones</span>
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    .fInputCotiz {
        width: 100%;
        padding-left: 1.75rem;
        padding-right: 0.75rem;
        padding-top: 0.625rem;
        padding-bottom: 0.625rem;
        border-radius: 0.75rem;
        border: 1px solid #d1d5db;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        font-weight: 600;
        transition: all 150ms;
    }
    .fInputCotiz:focus {
        border-color: #059669;
        box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.2);
        outline: none;
    }
</style>
