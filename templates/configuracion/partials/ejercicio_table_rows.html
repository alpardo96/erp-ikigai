<!-- 
    FILAS DE EJERCICIOS FISCALES
    Renderizado parcial HTMX - se inyecta en el tbody de la tabla.
-->
{% for ej in ejercicios %}
<tr>
    <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-medium text-gray-900 sm:pl-6">
        <div class="flex items-center">
            <div class="h-10 w-10 flex-shrink-0 bg-amber-50 rounded-lg flex items-center justify-center border border-amber-200">
                <svg class="h-5 w-5 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            </div>
            <div class="ml-4">
                <div class="font-bold text-gray-900">{{ ej.ejercicio }}</div>
            </div>
        </div>
    </td>
    <td class="whitespace-nowrap px-3 py-4 text-sm font-medium text-indigo-600">
        {{ ej.empresa.nombre }}
    </td>
    <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
        {{ ej.inicio|date:"d/m/Y" }}
    </td>
    <td class="whitespace-nowrap px-3 py-4 text-sm text-gray-500">
        {{ ej.cierre|date:"d/m/Y" }}
    </td>
    <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
        <div class="flex items-center justify-end space-x-2">
            <button hx-get="{% url 'config_ejercicio_edit' ej.id %}" 
                    hx-target="#modal-container"
                    class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 p-2 rounded flex items-center justify-center transition-colors shadow-sm" title="Editar Ejercicio">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button hx-post="{% url 'config_ejercicio_delete' ej.id %}" 
                    hx-confirm="¿Estás seguro de que deseas eliminar el ejercicio '{{ ej.ejercicio }}'?"
                    class="text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 p-2 rounded flex items-center justify-center transition-colors shadow-sm" title="Eliminar Ejercicio">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="5" class="px-6 py-12 text-center text-sm text-gray-500">
        <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        <h3 class="mt-2 text-sm font-medium text-gray-900">No hay ejercicios fiscales registrados</h3>
        <p class="mt-1 text-sm text-gray-400">Creá un nuevo ejercicio para comenzar.</p>
    </td>
</tr>
{% endfor %}
