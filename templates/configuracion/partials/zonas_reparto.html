<button hx-push-url="{% url 'configuracion_index' %}" hx-get="{% url 'configuracion_index' %}?tab=hub" hx-target="#config-content" class="mb-6 inline-flex items-center px-4 py-2 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 rounded-xl text-sm font-bold transition-all shadow-sm">
    <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Volver al Panel Central
</button>

<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-xl font-bold text-gray-800">Zonas de Reparto</h2>
            <p class="text-sm text-gray-500 mt-1">Agrupan a los clientes y ordenan el recorrido de la hoja de ruta.</p>
        </div>
        <button hx-get="{% url 'config_zona_add' %}"
                hx-target="#modal-container"
                class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 transition-all font-medium shadow-sm">
            <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            Nueva Zona
        </button>
    </div>

    <div class="relative">
        <input type="text" name="q" placeholder="Buscar zona..."
               class="w-full pl-10 pr-4 py-2 rounded-xl border-gray-200 focus:ring-indigo-500 focus:border-indigo-500"
               hx-get="{% url 'config_zona_search' %}"
               hx-trigger="keyup changed delay:300ms"
               hx-target="#zona-rows">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
    </div>

    <div class="overflow-hidden shadow ring-1 ring-black ring-opacity-5 rounded-2xl border border-gray-100">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-slate-50">
                <tr>
                    <th class="py-3.5 pl-6 pr-3 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest">Orden</th>
                    <th class="px-3 py-3.5 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nombre</th>
                    <th class="px-3 py-3.5 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Clientes</th>
                    <th class="px-3 py-3.5 text-center text-[10px] font-bold text-slate-400 uppercase tracking-widest">Estado</th>
                    <th class="relative py-3.5 pl-3 pr-6 text-right text-[10px] font-bold text-slate-400 uppercase tracking-widest">Acciones</th>
                </tr>
            </thead>
            <tbody id="zona-rows"
                   class="divide-y divide-gray-100 bg-white"
                   hx-get="{% url 'config_zona_search' %}"
                   hx-trigger="reloadZonas from:body">
                {% include 'configuracion/partials/zona_table_rows.html' %}
            </tbody>
        </table>
    </div>
</div>
