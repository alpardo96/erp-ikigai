{% for t in tarjetas %}
<tr class="hover:bg-slate-50/60 transition-colors">
    <td class="whitespace-nowrap py-4 pl-4 pr-3 text-sm font-semibold font-mono text-gray-900 sm:pl-6">{{ t.codigo }}</td>
    <td class="whitespace-nowrap px-3 py-4 text-sm font-medium text-gray-800">
        {{ t.nombre }}
    </td>
    <td class="whitespace-nowrap px-3 py-4 text-sm text-center">
        {% if t.tipo == 'C' %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-purple-100 text-purple-800 border border-purple-200">
                Crédito
            </span>
        {% else %}
            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-100 text-sky-800 border border-sky-200">
                Débito
            </span>
        {% endif %}
    </td>
    <td class="relative whitespace-nowrap py-4 pl-3 pr-4 text-right text-sm font-medium sm:pr-6">
        <div class="flex items-center justify-end space-x-2">
            <button hx-get="{% url 'config_tarjeta_edit' t.id %}" 
                    hx-target="#modal-container"
                    title="Editar"
                    class="text-indigo-600 hover:text-indigo-800 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-xl transition-colors shadow-sm">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button hx-post="{% url 'config_tarjeta_delete' t.id %}" 
                    hx-confirm="¿Estás seguro de eliminar la tarjeta {{ t.nombre }}?"
                    title="Eliminar"
                    class="text-red-600 hover:text-red-800 bg-red-50 hover:bg-red-100 p-2 rounded-xl transition-colors shadow-sm">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="px-6 py-10 text-center text-gray-500 text-sm italic">No se encontraron tarjetas registradas.</td>
</tr>
{% endfor %}
