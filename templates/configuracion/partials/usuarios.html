<button hx-push-url="{% url 'configuracion_index' %}" hx-get="{% url 'configuracion_index' %}?tab=hub" hx-target="#config-content" class="mb-6 inline-flex items-center px-4 py-2 bg-indigo-100 text-indigo-700 hover:bg-indigo-200 hover:text-indigo-800 rounded-xl text-sm font-bold transition-all shadow-sm">
    <svg class="mr-2 w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
    Volver al Panel Central
</button>
<!-- 
    LISTADO DE USUARIOS
    Permite administrar los talentos y sus niveles de acceso (permisos).
-->
<div>
    <div class="sm:flex sm:items-center justify-between">
        <div class="sm:flex-auto">
            <h2 class="text-xl font-semibold text-gray-900">Gestión de Usuarios</h2>
            <p class="mt-2 text-sm text-gray-500 italic">Controla quién accede al sistema y con qué privilegios.</p>
        </div>
        <div class="mt-4 sm:mt-0 flex space-x-3 items-center">
            <!-- Barra de búsqueda reactiva -->
            <div class="relative">
                <input type="text" 
                       name="q" 
                       hx-get="{% url 'config_usuario_search' %}" 
                       hx-trigger="keyup changed delay:300ms, search" 
                       hx-target="#usuarios-tbody" 
                       class="input-icon-left" 
                       placeholder="Filtrar por nombre...">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
                    <svg class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd" /></svg>
                </div>
            </div>

            <!-- Acción: Despliega modal de usuario con posicionamiento absoluto -->
            <button hx-get="{% url 'config_usuario_add' %}" 
                    hx-target="#modal-container"
                    class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-bold text-white shadow-xl shadow-indigo-100 hover:bg-indigo-700 transition-all hover:scale-[1.03] active:scale-95">
                <svg class="h-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Nuevo Usuario
            </button>
        </div>
    </div>
    
    <!-- Tabla Principal: Dinamismo puro vía HTMX -->
    <div class="mt-8 flex flex-col">
        <div class="-my-2 -mx-4 overflow-x-auto sm:-mx-6 lg:-mx-8">
            <div class="inline-block min-w-full py-2 align-middle md:px-6 lg:px-8">
                <div class="overflow-hidden shadow-sm ring-1 ring-black ring-opacity-5 rounded-2xl border border-gray-100 bg-white">
                    <table class="min-w-full divide-y divide-gray-100">
                        <thead class="bg-slate-50">
                            <tr>
                                <th scope="col" class="py-4 pl-6 pr-3 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest">Nombre de Usuario</th>
                                <th scope="col" class="px-3 py-4 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest">Configurativa de Permisos</th>
                                <th scope="col" class="px-3 py-4 text-left text-[10px] font-bold text-slate-400 uppercase tracking-widest">Estado</th>
                                <th scope="col" class="relative py-4 pl-3 pr-6 text-right">
                                    <span class="sr-only">Acciones</span>
                                </th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-tbody" 
                               class="divide-y divide-gray-50" 
                               hx-get="{% url 'config_usuario_search' %}" 
                               hx-trigger="reloadUsuarios from:body">
                            {% include 'configuracion/partials/usuario_table_rows.html' %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
