{% for rol in roles %}
    <tr class="hover:bg-indigo-50/50 transition-colors duration-150 group">
        <!-- Info Principal -->
        <td class="whitespace-nowrap py-4 pl-6 pr-3">
            <div class="flex items-center">
                <div class="h-10 w-10 flex-shrink-0 bg-gradient-to-br from-indigo-100 to-indigo-50 rounded-xl border border-indigo-100 flex items-center justify-center">
                    <span class="text-indigo-600 font-bold text-lg">{{ rol.name|make_list|first|upper }}</span>
                </div>
                <div class="ml-4">
                    <div class="font-bold text-slate-900 group-hover:text-indigo-700 transition-colors">{{ rol.name }}</div>
                    <div class="text-[11px] text-slate-500 mt-0.5">ID: {{ rol.id }}</div>
                </div>
            </div>
        </td>

        <!-- Permisos Badge -->
        <td class="whitespace-normal px-3 py-4 text-sm text-slate-600">
            <div class="flex flex-wrap gap-1">
                <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-medium bg-slate-100 text-slate-600 border border-slate-200">
                    {{ rol.permissions.count }} permisos configurados
                </span>
            </div>
        </td>

        <!-- Acciones -->
        <td class="relative whitespace-nowrap py-4 pl-3 pr-6 text-right text-sm font-medium">
            <div class="flex items-center justify-end space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                <!-- Botón Editar (Lanza Modal) -->
                <button hx-get="{% url 'config_rol_edit' rol.id %}" 
                        hx-target="#modal-container"
                        class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 hover:bg-indigo-100 p-2 rounded-lg transition-colors"
                        title="Editar Rol">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                </button>
                
                <!-- Botón Eliminar (Confirma y lanza HTMX DELETE) -->
                <button hx-post="{% url 'config_rol_delete' rol.id %}"
                        hx-confirm="¿Estás seguro de que deseas eliminar este rol? Los usuarios asignados perderán estos permisos."
                        class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition-colors"
                        title="Eliminar Rol">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </button>
            </div>
        </td>
    </tr>
{% empty %}
    <tr>
        <td colspan="3" class="px-6 py-12 text-center">
            <svg class="mx-auto h-12 w-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M12 4v16m8-8H4"></path>
            </svg>
            <h3 class="mt-2 text-sm font-medium text-slate-900">No hay roles registrados</h3>
            <p class="mt-1 text-sm text-slate-500">Comienza creando un nuevo rol o grupo de permisos.</p>
        </td>
    </tr>
{% endfor %}
