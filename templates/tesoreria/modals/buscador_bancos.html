<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-200">
    <div class="bg-white w-full max-w-2xl mx-4 rounded-xl shadow-2xl flex flex-col max-h-[85vh] border border-slate-200"
         @click.stop>
        <!-- Header -->
        <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-xl">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-100 p-1.5 rounded-lg">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1-0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-sm font-black text-slate-800 uppercase tracking-tight">Buscar Banco (BCRA)</h2>
                    <p class="text-[10px] font-bold text-slate-500">Seleccione la entidad financiera por nombre o c├│digo oficial BCRA</p>
                </div>
            </div>
            <button type="button"
                    onclick="document.body.dispatchEvent(new Event('cerrarModal'))"
                    class="text-slate-400 hover:text-red-500 transition-colors p-1"
                    title="Cerrar">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>

        <!-- Buscador -->
        <div class="p-3 border-b border-slate-100 bg-white">
            <div class="relative flex items-center">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input type="text"
                       name="q"
                       autofocus
                       placeholder="Buscar por nombre de banco o c├│digo BCRA (ej: Santander, 072)..."
                       class="w-full h-10 pl-11 pr-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-800 outline-none focus:border-indigo-500 focus:bg-white transition-all shadow-inner"
                       hx-get="{% url 'tesoreria_bancos_buscar_lista' %}"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-target="#bancos-search-results"
                       hx-indicator="#loading-bancos">
                <div id="loading-bancos" class="absolute right-3 htmx-indicator">
                    <svg class="animate-spin h-4 w-4 text-indigo-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Resultados -->
        <div id="bancos-search-results"
             class="flex-1 overflow-auto bg-slate-50/50"
             hx-get="{% url 'tesoreria_bancos_buscar_lista' %}"
             hx-trigger="load">
            <div class="p-8 text-center text-slate-400 text-xs font-bold uppercase tracking-widest">Buscando bancos...</div>
        </div>
    </div>
</div>
