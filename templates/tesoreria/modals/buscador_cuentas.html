{# Modal de búsqueda avanzada de cuentas contables (botón lupa de la imputación). #}
<div class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4 py-6">
    <div class="relative transform overflow-hidden rounded-3xl bg-white text-left shadow-2xl w-full max-w-2xl flex flex-col max-h-[85vh]">

        <div class="bg-gradient-to-r from-gray-50 to-white px-6 py-4 border-b border-gray-100 flex items-center justify-between shrink-0">
            <div class="flex items-center">
                <div class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-2xl bg-indigo-100 text-indigo-600 mr-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-gray-900">Buscar Cuenta Contable</h3>
                    <p class="text-xs text-gray-400">Con el primer dígito de la jerarquía se acota al rubro (Activo, Ingresos, etc.)</p>
                </div>
            </div>
            <button type="button" class="text-gray-400 hover:text-red-500 transition-colors p-2 hover:bg-red-50 rounded-full"
                    onclick="document.getElementById('modal-container').innerHTML = ''">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-5 border-b border-gray-100 bg-white shrink-0">
            <div class="relative">
                <input type="text" name="q" autofocus
                       class="w-full pl-11 pr-4 py-3 rounded-2xl border-gray-200 focus:border-indigo-500 focus:ring-indigo-500 text-sm shadow-sm"
                       placeholder="Jerarquía o nombre de la cuenta..."
                       hx-get="{% url 'tesoreria_cuentas_buscar_lista' %}"
                       hx-target="#cuentas-modal-resultados"
                       hx-trigger="keyup changed delay:300ms, search">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div id="cuentas-modal-resultados" class="flex-1 overflow-y-auto bg-slate-50"
             hx-get="{% url 'tesoreria_cuentas_buscar_lista' %}" hx-trigger="load">
            <div class="p-8 text-center text-gray-400 text-sm">Cargando cuentas...</div>
        </div>
    </div>
</div>
