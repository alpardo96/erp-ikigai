{% extends 'base.html' %}

{% block title %}Listado de Órdenes de Pago{% endblock %}

{% block content %}
<div class="max-w-full mx-auto w-full px-4 py-2 space-y-4">

    <div class="flex justify-between items-center border-b border-gray-200 pb-2">
        <h1 class="text-xl font-black text-slate-900 tracking-tighter uppercase italic">Órdenes de Pago</h1>
        <div class="flex items-center gap-3">
            <a href="{% url 'ordenpago_carga' %}"
               class="bg-blue-600 hover:bg-blue-500 text-white font-black px-4 py-2 rounded-lg text-[10px] uppercase tracking-widest shadow transition-all">
                + Nueva Orden de Pago
            </a>
            <a href="{% url 'tesoreria_index' %}" class="text-slate-400 hover:text-red-600 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>
    </div>

    <!-- FILTROS: recargan la grilla por HTMX, sin refrescar la pantalla -->
    <form id="filtros-op"
          hx-get="{% url 'ordenpago_grilla' %}"
          hx-target="#grilla-op"
          hx-trigger="load, change, submit, reloadOrdenesPago from:body"
          class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-wrap items-end gap-3 italic">
        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Desde</label>
            <input type="date" name="desde" value="{{ desde }}" style="font-size: 18px !important;"
                   class="h-9 px-2 bg-slate-50 border border-slate-200 rounded-lg text-[12px] font-bold text-slate-800 outline-none focus:border-blue-500">
        </div>
        <div>
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Hasta</label>
            <input type="date" name="hasta" value="{{ hasta }}" style="font-size: 18px !important;"
                   class="h-9 px-2 bg-slate-50 border border-slate-200 rounded-lg text-[12px] font-bold text-slate-800 outline-none focus:border-blue-500">
        </div>
        <div class="min-w-[280px] flex-1" x-data="{ open: false }" @ordenpagoproveedorseleccionado.window="open = false">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Proveedor</label>
            <input type="hidden" name="proveedor" id="id_proveedor" value="{{ proveedor_id|default:'' }}">
            <div class="relative flex gap-1">
                <input type="text" id="proveedor_nombre_display" name="q_proveedor"
                       class="w-full h-9 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-[12px] font-bold text-slate-800 outline-none focus:border-blue-500 placeholder:text-slate-400 truncate"
                       placeholder="Todos los proveedores..."
                       value="{{ proveedor_display|default:'' }}"
                       hx-get="{% url 'op_proveedor_buscar_lista' %}"
                       hx-trigger="keyup changed delay:300ms, search, focus"
                       hx-target="#proveedor_suggestions"
                       autocomplete="off"
                       @focus="open = true" @click.outside="open = false" @keydown.escape="open = false"
                       oninput="if(this.value === '') { const el = document.getElementById('id_proveedor'); if(el.value !== '') { el.value = ''; el.dispatchEvent(new Event('change', { bubbles: true })); } }">
                <button type="button" hx-get="{% url 'op_proveedor_buscar_modal' %}"
                        hx-target="#modal-container"
                        class="w-9 h-9 shrink-0 flex items-center justify-center bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition-all cursor-pointer"
                        title="Buscar proveedor">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </button>
            </div>
            <div x-show="open" id="proveedor_suggestions"
                 class="absolute z-50 left-0 top-full mt-1 w-full bg-white border border-slate-200 rounded-lg shadow-xl overflow-hidden max-h-64 overflow-y-auto"
                 style="display: none;">
            </div>
        </div>
        {# Filtro Real / Presupuestado / Ambos, obligatorio en todo listado con importes. #}
        <div>
            <span class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter ">Condición</span>
            <select name="condic"
                    class="px-2 py-1 rounded-lg border-gray-200 text-sm focus:ring-indigo-500 focus:border-indigo-500 outline-none bg-gray-50 cursor-pointer">
                <option value="">Ambas</option>
                <option value="1" {% if condic == '1' %}selected{% endif %}>Real</option>
                <option value="2" {% if condic == '2' %}selected{% endif %}>Presupuestado</option>
            </select>
        </div>
        <div class="flex-1 min-w-[180px]">
            <label class="block text-[10px] font-black text-slate-400 uppercase mb-1 tracking-tighter">Buscar</label>
            <input type="text" name="q" placeholder="Proveedor u observaciones..."
                   class="w-full h-9 px-2 bg-slate-50 border border-slate-200 rounded-lg text-[12px] font-bold text-slate-800 outline-none focus:border-blue-500">
        </div>
    </form>

    <div id="grilla-op" class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
        <div class="p-8 text-center text-slate-400 text-sm italic">Cargando órdenes de pago...</div>
    </div>
</div>

<div id="modal-container"></div>

<script>
// Un 409 al anular significa que la reversión está bloqueada (por ejemplo, un cheque ya
// debitado por el banco). HTMX no swapea las respuestas de error, así que se muestra el
// motivo tal como lo explica el servidor.
document.body.addEventListener('htmx:responseError', (e) => {
    if (e.detail.xhr.status === 409) {
        alert(e.detail.xhr.responseText.replace(/<[^>]*>/g, '').trim());
    }
});
document.body.addEventListener('ordenPagoProveedorSeleccionado', (e) => {
    const modalContainer = document.getElementById('modal-container');
    if (modalContainer) modalContainer.innerHTML = '';

    const idProveedor = document.getElementById('id_proveedor');
    const displayProveedor = document.getElementById('proveedor_nombre_display');
    if (idProveedor && displayProveedor) {
        idProveedor.value = e.detail.id;
        displayProveedor.value = e.detail.razon_social;
        idProveedor.dispatchEvent(new Event('change', { bubbles: true }));
    }
});
</script>
{% endblock %}
