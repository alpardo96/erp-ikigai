{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | ERP - Gestión Administrativa Contable</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'media/favi_logo.png' %}">
    <!-- Tailwind CSS -->
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans h-screen flex flex-col justify-center">

    <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <br/>
            <img class="mx-auto h-40 w-auto drop-shadow-xl" src="{% static 'media/logo.png' %}" alt="Logo">
            <h2 class="mt-6 text-center text-4xl font-black text-gray-900 tracking-tight">
                Ingreso al Sistema
            </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-10 px-6 shadow-[0_20px_50px_rgba(8,_112,_184,_0.07)] sm:rounded-[2.5rem] sm:px-12 border border-gray-50">
                <form class="space-y-7" method="POST">
                    {% csrf_token %}
                    {% if form.errors %}
                        <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-4">
                            <p class="text-sm text-red-700">Usuario o contraseña incorrectos. Por favor, intente de nuevo.</p>
                        </div>
                    {% endif %}
                    {% if next %}
                        <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}
                    <div>
                        <label for="username">Usuario</label>
                        <input id="username" name="username" type="text" required placeholder="Tu nombre de usuario">
                    </div>

                    <div>
                        <label for="password">Contraseña</label>
                        <input id="password" name="password" type="password" required placeholder="••••••••">
                    </div>
                    <div>
                        <button type="submit" class="btn-premium">
                            ENTRAR AL SISTEMA
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
